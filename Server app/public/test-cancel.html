<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cancelar Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Test - Cancelar Factura</h2>
        
        <!-- Simulación de un pedido con factura -->
        <div class="card mt-4">
            <div class="card-header">
                <h5>Pedido #123 - Facturado</h5>
            </div>
            <div class="card-body">
                <p><strong>Cliente:</strong> 12345678-9 - Cliente Test</p>
                <p><strong>Total:</strong> $15.000</p>
                <p><strong>Folio Factura:</strong> 001-001-0000123</p>
                <p><strong>Estado:</strong> <span class="badge bg-success">Facturado</span></p>
                
                <button type="button" 
                        class="btn btn-danger btn-sm" 
                        onclick="openModalCancelarFactura(123, '001-001-0000123')"
                        title="Cancelar Factura">
                    <i class="fas fa-ban"></i> Cancelar Factura
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Cancelar Factura -->
    <div class="modal fade" id="cancelarFacturaModal" tabindex="-1" aria-labelledby="cancelarFacturaModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="cancelarFacturaModalLabel">
                        <i class="fas fa-ban me-2"></i>Cancelar Factura
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-warning" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>¡Atención!</strong> Esta acción generará una Nota de Crédito que anulará la factura original.
                        Esta operación no se puede deshacer.
                    </div>
                    
                    <form id="formCancelarFactura">
                        <input type="hidden" id="cancel_pedido_id" name="pedido_id">
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="cancel_folio_referencia" class="form-label">
                                        <i class="fas fa-file-invoice me-1"></i>Folio de Factura a Cancelar *
                                    </label>
                                    <input type="text" class="form-control" id="cancel_folio_referencia" 
                                           name="folio_referencia" readonly>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="cancel_fecha_emision" class="form-label">
                                        <i class="fas fa-calendar me-1"></i>Fecha de Emisión *
                                    </label>
                                    <input type="date" class="form-control" id="cancel_fecha_emision" 
                                           name="fecha_emision" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="cancel_fecha_vencimiento" class="form-label">
                                        <i class="fas fa-calendar-check me-1"></i>Fecha de Vencimiento *
                                    </label>
                                    <input type="date" class="form-control" id="cancel_fecha_vencimiento" 
                                           name="fecha_vencimiento" required>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="cancel_documento_referencia" class="form-label">
                                        <i class="fas fa-file-alt me-1"></i>Tipo de Documento
                                    </label>
                                    <select class="form-control" id="cancel_documento_referencia" name="documento_referencia">
                                        <option value="33">Factura Afecta</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="cancel_comment" class="form-label">
                                <i class="fas fa-comment me-1"></i>Motivo de Cancelación *
                            </label>
                            <textarea class="form-control" id="cancel_comment" name="comment" 
                                      rows="3" required placeholder="Ingrese el motivo de la cancelación..."></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="cancel_forma" class="form-label">
                                <i class="fas fa-credit-card me-1"></i>Forma de Pago
                            </label>
                            <select class="form-control" id="cancel_forma" name="forma">
                                <option value="1">Contado</option>
                                <option value="2">Crédito</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i>Cancelar
                    </button>
                    <button type="button" class="btn btn-danger" onclick="procesarNotaCredito()">
                        <i class="fas fa-ban me-1"></i>Generar Nota de Crédito
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script>
        function openModalCancelarFactura(pedidoId, folioFactura) {
            // Limpiar formulario
            document.getElementById('formCancelarFactura').reset();
            
            // Establecer valores
            document.getElementById('cancel_pedido_id').value = pedidoId;
            document.getElementById('cancel_folio_referencia').value = folioFactura;
            
            // Establecer fechas por defecto
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('cancel_fecha_emision').value = today;
            document.getElementById('cancel_fecha_vencimiento').value = today;
            
            // Mostrar modal
            const modal = new bootstrap.Modal(document.getElementById('cancelarFacturaModal'));
            modal.show();
        }

        function validateNotaCreditoForm() {
            const requiredFields = [
                'cancel_pedido_id',
                'cancel_folio_referencia', 
                'cancel_fecha_emision',
                'cancel_fecha_vencimiento',
                'cancel_comment'
            ];
            
            for (let fieldId of requiredFields) {
                const field = document.getElementById(fieldId);
                if (!field.value.trim()) {
                    field.focus();
                    alert('Por favor complete todos los campos obligatorios');
                    return false;
                }
            }
            
            return true;
        }

        function procesarNotaCredito() {
            if (!validateNotaCreditoForm()) {
                return;
            }
            
            const formData = new FormData(document.getElementById('formCancelarFactura'));
            
            // Mostrar loading
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Procesando...';
            btn.disabled = true;
            
            fetch('/web/pedido/cancelar-factura', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.content || ''
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Nota de crédito generada exitosamente');
                    bootstrap.Modal.getInstance(document.getElementById('cancelarFacturaModal')).hide();
                    // Aquí podrías recargar la tabla o actualizar la interfaz
                } else {
                    alert('Error: ' + (data.message || 'No se pudo generar la nota de crédito'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error de conexión. Por favor intente nuevamente.');
            })
            .finally(() => {
                // Restaurar botón
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
