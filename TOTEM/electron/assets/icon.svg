<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradiente de fondo -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd89b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9a56;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  
  <!-- Ícono principal - Símbolo de pago/terminal -->
  <g transform="translate(256 256)">
    <!-- Terminal de pago -->
    <rect x="-120" y="-160" width="240" height="280" rx="20" fill="white" opacity="0.95"/>
    
    <!-- Pantalla -->
    <rect x="-100" y="-140" width="200" height="140" rx="10" fill="url(#iconGradient)"/>
    
    <!-- Líneas de texto en pantalla -->
    <rect x="-80" y="-110" width="160" height="15" rx="7" fill="white" opacity="0.8"/>
    <rect x="-80" y="-80" width="120" height="15" rx="7" fill="white" opacity="0.6"/>
    <rect x="-80" y="-50" width="140" height="15" rx="7" fill="white" opacity="0.4"/>
    
    <!-- Teclado numérico -->
    <g fill="#667eea" opacity="0.6">
      <!-- Fila 1 -->
      <circle cx="-50" cy="20" r="15"/>
      <circle cx="0" cy="20" r="15"/>
      <circle cx="50" cy="20" r="15"/>
      <!-- Fila 2 -->
      <circle cx="-50" cy="60" r="15"/>
      <circle cx="0" cy="60" r="15"/>
      <circle cx="50" cy="60" r="15"/>
      <!-- Fila 3 -->
      <circle cx="-50" cy="100" r="15"/>
      <circle cx="0" cy="100" r="15"/>
      <circle cx="50" cy="100" r="15"/>
    </g>
    
    <!-- Símbolo $ -->
    <text x="0" y="-210" font-size="100" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">$</text>
  </g>
  
  <!-- Decoración: puntos de brillo -->
  <circle cx="420" cy="92" r="20" fill="white" opacity="0.3"/>
  <circle cx="90" cy="420" r="25" fill="white" opacity="0.2"/>
  <circle cx="450" cy="380" r="15" fill="white" opacity="0.25"/>
</svg>
