<VirtualHost *:80>
    ServerName apimercado.posfagotto.cl
    DocumentRoot /var/www/apimercado
    
    <Directory /var/www/apimercado>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # PHP Settings
        php_flag display_errors Off
        php_flag log_errors On
    </Directory>
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/apimercado-error.log
    CustomLog ${APACHE_LOG_DIR}/apimercado-access.log combined
    
    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>
