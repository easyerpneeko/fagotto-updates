<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versiones por Negocio - Fagotto ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1400px;
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .table {
            margin-bottom: 0;
        }
        .version-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .version-latest {
            background-color: #28a745;
            color: white;
        }
        .version-old {
            background-color: #ffc107;
            color: #000;
        }
        .version-outdated {
            background-color: #dc3545;
            color: white;
        }
        .ping-recent {
            color: #28a745;
        }
        .ping-warning {
            color: #ffc107;
        }
        .ping-offline {
            color: #dc3545;
        }
        .stats-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .stats-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        .stats-label {
            color: #6c757d;
            font-size: 14px;
            margin-top: 5px;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .filter-buttons {
            margin-bottom: 20px;
        }
        .btn-filter {
            margin-right: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-white text-center mb-4">
            <i class="fas fa-chart-line"></i> Monitor de Versiones - Fagotto ERP
        </h1>

        <!-- Estadísticas -->
        <div class="row" id="stats-row">
            <!-- Se llenarán con JS -->
        </div>

        <!-- Filtros y búsqueda -->
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="search-box">
                            <input type="text" id="searchInput" class="form-control" placeholder="🔍 Buscar negocio...">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="filter-buttons text-end">
                            <button class="btn btn-sm btn-outline-success btn-filter" onclick="filterByVersion('all')">
                                Todos
                            </button>
                            <button class="btn btn-sm btn-outline-success btn-filter" onclick="filterByVersion('latest')">
                                Última versión
                            </button>
                            <button class="btn btn-sm btn-outline-warning btn-filter" onclick="filterByVersion('old')">
                                Desactualizados
                            </button>
                            <button class="btn btn-sm btn-outline-danger btn-filter" onclick="filterByVersion('offline')">
                                Sin conexión
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de versiones -->
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">
                    <i class="fas fa-store"></i> Negocios y Versiones
                </h3>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Negocio</th>
                                <th>Versión</th>
                                <th>Última Conexión</th>
                                <th>Estado</th>
                                <th>Sistema</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable">
                            <tr>
                                <td colspan="7" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allData = [];
        let latestVersion = '';

        // Cargar datos
        async function loadData() {
            try {
                const response = await fetch('get_app_versions.php');
                const result = await response.json();
                
                if (result.success) {
                    allData = result.data;
                    latestVersion = result.latest_version;
                    renderStats(result.stats);
                    renderTable(allData);
                }
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('dataTable').innerHTML = `
                    <tr><td colspan="7" class="text-center text-danger">Error al cargar datos</td></tr>
                `;
            }
        }

        // Renderizar estadísticas
        function renderStats(stats) {
            const statsHtml = `
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-number">${stats.total}</div>
                        <div class="stats-label">Total Negocios</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-number text-success">${stats.updated}</div>
                        <div class="stats-label">Actualizados</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-number text-warning">${stats.outdated}</div>
                        <div class="stats-label">Desactualizados</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-number text-danger">${stats.offline}</div>
                        <div class="stats-label">Sin Conexión (>1hr)</div>
                    </div>
                </div>
            `;
            document.getElementById('stats-row').innerHTML = statsHtml;
        }

        // Renderizar tabla
        function renderTable(data) {
            if (data.length === 0) {
                document.getElementById('dataTable').innerHTML = `
                    <tr><td colspan="7" class="text-center">No hay datos disponibles</td></tr>
                `;
                return;
            }

            const rows = data.map(item => {
                const versionClass = getVersionClass(item.current_version, latestVersion);
                const pingClass = getPingClass(item.minutes_since_ping);
                const statusIcon = getStatusIcon(item.minutes_since_ping);
                
                return `
                    <tr>
                        <td>${item.app_id}</td>
                        <td><strong>${item.app_name}</strong></td>
                        <td>
                            <span class="version-badge ${versionClass}">
                                v${item.current_version}
                            </span>
                        </td>
                        <td class="${pingClass}">
                            <i class="fas fa-clock"></i>
                            ${item.last_ping_formatted}
                            <br>
                            <small>${item.minutes_since_ping} min ago</small>
                        </td>
                        <td>
                            <i class="${statusIcon}"></i>
                        </td>
                        <td>
                            <small>${item.system_info || 'N/A'}</small>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="viewHistory(${item.app_id})">
                                <i class="fas fa-history"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('dataTable').innerHTML = rows;
        }

        // Determinar clase de versión
        function getVersionClass(currentVersion, latestVersion) {
            if (currentVersion === latestVersion) return 'version-latest';
            
            const current = parseVersion(currentVersion);
            const latest = parseVersion(latestVersion);
            
            const diff = (latest.major - current.major) * 100 + 
                         (latest.minor - current.minor) * 10 + 
                         (latest.patch - current.patch);
            
            if (diff <= 5) return 'version-old';
            return 'version-outdated';
        }

        // Parsear versión
        function parseVersion(version) {
            const parts = version.split('.').map(Number);
            return {
                major: parts[0] || 0,
                minor: parts[1] || 0,
                patch: parts[2] || 0
            };
        }

        // Determinar clase de ping
        function getPingClass(minutes) {
            if (minutes <= 10) return 'ping-recent';
            if (minutes <= 60) return 'ping-warning';
            return 'ping-offline';
        }

        // Obtener icono de estado
        function getStatusIcon(minutes) {
            if (minutes <= 10) return 'fas fa-circle ping-recent';
            if (minutes <= 60) return 'fas fa-circle ping-warning';
            return 'fas fa-circle ping-offline';
        }

        // Filtrar por versión
        function filterByVersion(filter) {
            let filtered = allData;
            
            if (filter === 'latest') {
                filtered = allData.filter(item => item.current_version === latestVersion);
            } else if (filter === 'old') {
                filtered = allData.filter(item => 
                    item.current_version !== latestVersion && item.minutes_since_ping <= 60
                );
            } else if (filter === 'offline') {
                filtered = allData.filter(item => item.minutes_since_ping > 60);
            }
            
            renderTable(filtered);
        }

        // Búsqueda
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const filtered = allData.filter(item => 
                    item.app_name.toLowerCase().includes(searchTerm) ||
                    item.app_id.toString().includes(searchTerm)
                );
                renderTable(filtered);
            });
        });

        // Ver historial
        function viewHistory(appId) {
            alert('Ver historial de versiones para negocio ID: ' + appId);
            // Aquí puedes implementar un modal con el historial
        }

        // Auto-refresh cada 30 segundos
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
