<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Salsas - BD Real</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .salsa-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        
        .salsa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        }
        
        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
            appearance: none;
            background: #c6c6c6;
            outline: none;
            border-radius: 20px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
            transition: 0.5s;
            cursor: pointer;
        }
        
        .toggle-switch:checked {
            background: #03a9f4;
        }
        
        .toggle-switch:before {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 20px;
            top: 2px;
            left: 2px;
            background: white;
            transition: 0.5s;
        }
        
        .toggle-switch:checked:before {
            transform: translateX(30px);
        }
        
        .badge {
            border-radius: 20px;
            padding: 0.5rem 1rem;
        }
        
        .btn-refresh {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
        }
        
        .btn-refresh:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            transform: translateY(-2px);
        }
        
        .alert-custom {
            border-radius: 10px;
            border: none;
            backdrop-filter: blur(10px);
        }
        
        .text-white { color: white !important; }
        .text-light { color: #f8f9fa !important; }
        
        .loading-spinner {
            display: none;
        }
        
        .loading-spinner.show {
            display: block;
        }
        
        h1, h2, h3, h4, h5, h6 {
            color: white;
        }
        
        .salsa-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: white;
        }
        
        .toggle-label {
            color: #f8f9fa;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Header -->
        <div class="glass-card text-center">
            <h1 class="mb-3">
                <i class="fas fa-pepper-hot me-3"></i>
                Administración de Salsas
            </h1>
            <p class="text-light mb-4">
                Gestiona todos los productos desde la BD real - posfagotto.cl
            </p>
            <button class="btn btn-refresh" onclick="cargarTodosLosProductos()">
                <i class="fas fa-sync-alt me-2"></i>
                Cargar Productos de BD
            </button>
            <button class="btn btn-warning ms-2" onclick="resetearVista()" title="Limpiar vista">
                <i class="fas fa-eye me-2"></i>
                Limpiar Vista
            </button>
        </div>

        <!-- Loading Spinner -->
        <div class="loading-spinner text-center" id="loadingSpinner">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="text-light mt-3">Cargando productos desde BD...</p>
        </div>

        <!-- Alertas -->
        <div id="alertContainer"></div>

        <!-- Grid de Productos -->
        <div class="row" id="productosContainer">
            <div class="col-12">
                <div class="glass-card text-center">
                    <p class="text-light">
                        <i class="fas fa-info-circle me-2"></i>
                        Haz clic en "Cargar Productos de BD" para ver todos los productos de la base de datos
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/helpers/helperSpecial.js"></script>
    <script src="../assets/helpers/helperAlert.js"></script>
    <script src="../assets/helpers/helperRequest.js"></script>
    
    <script>
        console.log('🚀 ADMINISTRACIÓN DE SALSAS v7.0 - BD REAL CONECTADA');
        
        // Variables globales
        let productosData = [];
        
        /**
         * Cargar TODOS los productos de la BD real usando helperRequest
         */
        async function cargarTodosLosProductos() {
            console.log('📡 CARGANDO TODOS LOS PRODUCTOS DESDE BD REAL...');
            mostrarLoading(true);
            limpiarAlertas();
            
            try {
                console.log('🔍 Consultando API con helperRequest...');
                
                // Usar __conection helper que maneja CORS correctamente
                __conection({
                    url: 'https://posfagotto.cl/api/products/sell',
                    method: 'GET',
                    dev: true
                }, {}, function(response) {
                    console.log('📋 Respuesta completa de BD:', response);
                    
                    if (response && response.data) {
                        productosData = response.data;
                        
                        if (productosData.length > 0) {
                            console.log(`✅ ${productosData.length} productos encontrados en BD`);
                            mostrarProductos(productosData);
                            mostrarAlerta('success', `✅ ${productosData.length} productos cargados desde BD real`);
                        } else {
                            mostrarAlerta('warning', '⚠️ No se encontraron productos en la BD');
                        }
                    } else if (response && Array.isArray(response)) {
                        // Si la respuesta es directamente un array
                        productosData = response;
                        console.log(`✅ ${productosData.length} productos encontrados (array directo)`);
                        mostrarProductos(productosData);
                        mostrarAlerta('success', `✅ ${productosData.length} productos cargados desde BD real`);
                    } else {
                        console.error('❌ Formato de respuesta inesperado:', response);
                        mostrarAlerta('error', '❌ Formato de respuesta inesperado de la BD');
                    }
                    
                    mostrarLoading(false);
                });
                
            } catch (error) {
                console.error('❌ ERROR CARGANDO PRODUCTOS:', error);
                mostrarAlerta('error', `❌ Error conectando con BD: ${error.message}`);
                mostrarAlerta('info', 'ℹ️ Verifica que estés logueado en posfagotto.cl');
                mostrarLoading(false);
            }
        }
        
        /**
         * Mostrar productos en la interfaz
         */
        function mostrarProductos(productos) {
            const container = document.getElementById('productosContainer');
            
            if (productos.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="glass-card text-center">
                            <p class="text-light">No hay productos para mostrar</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            productos.forEach(producto => {
                html += crearTarjetaProducto(producto);
            });
            
            container.innerHTML = html;
            console.log(`🎨 ${productos.length} productos mostrados en interfaz`);
        }
        
        /**
         * Crear tarjeta individual de producto
         */
        function crearTarjetaProducto(producto) {
            const { id, name, active, trash } = producto;
            
            return `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="salsa-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="salsa-name mb-0">${name}</h5>
                            <small class="text-light">#${id}</small>
                        </div>
                        
                        <!-- Toggle Activo -->
                        <div class="mb-3">
                            <div class="toggle-label">Estado:</div>
                            <div class="d-flex align-items-center">
                                <input type="checkbox" 
                                       id="switch-active-${id}" 
                                       class="toggle-switch me-3"
                                       ${active == 1 ? 'checked' : ''}
                                       onchange="actualizarEstadoBD(${id}, 'active', this.checked)">
                                <span class="badge ${active == 1 ? 'bg-success' : 'bg-secondary'}" id="badge-active-${id}">
                                    ${active == 1 ? 'Activo' : 'Inactivo'}
                                </span>
                            </div>
                        </div>
                        
                        <!-- Toggle Trash -->
                        <div class="mb-3">
                            <div class="toggle-label">Papelera:</div>
                            <div class="d-flex align-items-center">
                                <input type="checkbox" 
                                       id="switch-trash-${id}" 
                                       class="toggle-switch me-3"
                                       ${trash == 1 ? 'checked' : ''}
                                       onchange="actualizarEstadoBD(${id}, 'trash', this.checked)">
                                <span class="badge ${trash == 1 ? 'bg-warning' : 'bg-secondary'}" id="badge-trash-${id}">
                                    ${trash == 1 ? 'En Papelera' : 'Normal'}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        /**
         * Actualizar estado en BD REAL usando helperRequest
         */
        async function actualizarEstadoBD(id, campo, valor) {
            console.log(`🔄 ACTUALIZANDO ${campo} EN BD REAL para ID ${id}: ${valor}`);
            
            const producto = productosData.find(p => p.id == id);
            const nombreProducto = producto?.name || `Producto ID ${id}`;
            
            mostrarAlerta('info', `🔄 Actualizando ${nombreProducto} en base de datos...`);
            
            try {
                // API endpoints de posfagotto.cl usando helperRequest
                const endpoint = campo === 'active' ? 'toggle-active' : 'toggle-trash';
                const url = `https://posfagotto.cl/api/product/${id}/${endpoint}`;
                
                console.log(`📤 PUT -> ${url}`);
                
                // Usar __conection para manejar CORS correctamente
                __conection({
                    url: url,
                    method: 'PUT',
                    dev: true
                }, {
                    [campo]: valor ? 1 : 0
                }, function(response) {
                    console.log('📋 Respuesta del servidor:', response);
                    
                    if (response && response.success) {
                        console.log('✅ BD ACTUALIZADA:', response);
                        
                        // Actualizar datos locales
                        if (producto) {
                            producto[campo] = valor ? 1 : 0;
                            console.log('📊 Producto actualizado localmente:', producto);
                        }
                        
                        // Actualizar badge visual
                        actualizarBadge(id, campo, valor);
                        
                        // Mostrar éxito
                        const estadoTexto = valor ? 'ACTIVADO' : 'DESACTIVADO';
                        const icono = valor ? '✅' : '❌';
                        mostrarAlerta('success', `${icono} ${nombreProducto} ${estadoTexto} en BD real`);
                        
                    } else {
                        console.error('❌ Respuesta de error:', response);
                        throw new Error(response.message || 'Error desconocido del servidor');
                    }
                });
                
            } catch (error) {
                console.error('❌ ERROR ACTUALIZANDO BD:', error);
                mostrarAlerta('error', `❌ Error actualizando ${nombreProducto}: ${error.message}`);
                
                // Revertir el checkbox si falló
                const checkbox = document.getElementById(`switch-${campo}-${id}`);
                if (checkbox) {
                    checkbox.checked = !valor;
                    console.log('🔄 Checkbox revertido por error');
                }
            }
        }
        
        /**
         * Actualizar badge visual
         */
        function actualizarBadge(id, campo, valor) {
            const badge = document.getElementById(`badge-${campo}-${id}`);
            if (badge && campo === 'active') {
                badge.className = `badge ${valor ? 'bg-success' : 'bg-secondary'}`;
                badge.textContent = valor ? 'Activo' : 'Inactivo';
            } else if (badge && campo === 'trash') {
                badge.className = `badge ${valor ? 'bg-warning' : 'bg-secondary'}`;
                badge.textContent = valor ? 'En Papelera' : 'Normal';
            }
        }
        
        /**
         * Mostrar/ocultar spinner de carga
         */
        function mostrarLoading(mostrar) {
            const spinner = document.getElementById('loadingSpinner');
            if (mostrar) {
                spinner.classList.add('show');
            } else {
                spinner.classList.remove('show');
            }
        }
        
        /**
         * Mostrar alerta
         */
        function mostrarAlerta(tipo, mensaje) {
            const container = document.getElementById('alertContainer');
            const alertId = 'alert-' + Date.now();
            
            const colores = {
                'success': 'alert-success',
                'error': 'alert-danger',
                'warning': 'alert-warning',
                'info': 'alert-info'
            };
            
            const html = `
                <div class="alert ${colores[tipo]} alert-custom alert-dismissible fade show" role="alert" id="${alertId}">
                    ${mensaje}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', html);
            
            // Auto-ocultar después de 5 segundos (excepto errores)
            if (tipo !== 'error') {
                setTimeout(() => {
                    const alert = document.getElementById(alertId);
                    if (alert) {
                        alert.remove();
                    }
                }, 5000);
            }
        }
        
        /**
         * Limpiar alertas
         */
        function limpiarAlertas() {
            document.getElementById('alertContainer').innerHTML = '';
        }
        
        /**
         * Resetear vista
         */
        function resetearVista() {
            console.log('🔄 Limpiando vista...');
            productosData = [];
            document.getElementById('productosContainer').innerHTML = `
                <div class="col-12">
                    <div class="glass-card text-center">
                        <p class="text-light">
                            <i class="fas fa-info-circle me-2"></i>
                            Haz clic en "Cargar Productos de BD" para ver todos los productos de la base de datos
                        </p>
                    </div>
                </div>
            `;
            limpiarAlertas();
            mostrarAlerta('info', '🔄 Vista limpiada');
        }
        
        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎉 PÁGINA CARGADA - Sistema conectado a BD real');
            mostrarAlerta('info', '💡 Sistema listo. Haz clic en "Cargar Productos de BD" para comenzar');
        });
    </script>
</body>
</html>
