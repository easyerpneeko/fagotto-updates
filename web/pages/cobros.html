                    <div class="modal-content">
                        <div class="modal-header">

                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body row">
                            <div v-if="description" class="form-group col-12">
                                <div class="mb-3">
                                    <label for="description" class="form-label">Descripcion</label>
                                    <input id="description" type="text" class="form-control" placeholder="Descripcion"

                            </div>
                            <div v-if="percentage" class="form-group col-12">

                                </div>
                            </div>
                            <div v-if="monto" class="form-group col-12">

                                    <label for="amount" class="form-label">Monto</label>

                                </div>
                            </div>
                        </div>

                        </div>

             <!--Modal nuevo cobro-->
             <div style="" class="modal fade" id="newCobroModal" tabindex="-1" role="dialog" aria-labelledby="clientCreate" aria-hidden="true" data-backdrop="false">

                    <div class="modal-content">

                            <h5 class="modal-title">Nuevo Cobro</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body row">

                            
                            <div class="form-group col-md-12 col-12">
                                <div class="mb-3">
                                    <label for="tipo-despacho">SUCURSAL:</label>
                                    <select class="form-select" aria-label="select-sucursales" id="select-sucursales" required>
                                            <!-- <option value="0" selected>-- SELECCIONA LA SUCURSAL</option>
                                            <option value="2">PLAZA DE ARMAS</option>
                                            <option value="3">MERCED</option> -->
                                    </select>
                                </div>
                            </div>

                            <div class="form-group col-md-12 col-12">
                                <div class="mb-3">
                                    <label for="tipo-despacho">Forma de pago:</label>
                                    <select class="form-select" aria-label="select-sucursales" id="select-forma-pago" required>
                                            <option value="debito">Debito</option>
                                            <option value="credito">Credito</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group col-md-6 col-12">
                                <div class="mb-3">
                                    <label for="total_ventas" class="form-label">Total de ventas</label>
                                    <input id="total_ventas" type="text" class="form-control" placeholder="$"  required>
                                </div>
                            </div>
                            <div class="form-group col-md-6 col-12">
                                <div class="mb-3">
                                    <label for="direccion" class="form-label">Direccion</label>
                                    <input id="direccion" type="text" class="form-control" placeholder="Direccion"  maxlength="255" required>
                                </div>
                            </div>
                            <div class="form-group col-md-6 col-12">
                                <div class="mb-3">
                                    <label for="rut_emisor" class="form-label">RUT Emisor</label>
                                    <input id="rut_emisor" type="text" class="form-control" placeholder="1234567-1"  maxlength="20" required>
                                </div>
                            </div>
                            <div class="form-group col-md-6 col-12">
                                <div class="mb-3">
                                    <label for="rut_receptor" class="form-label">RUT Receptor</label>
                                    <input id="rut_receptor" type="text" class="form-control" placeholder="1234567-1"  maxlength="20" required>
                                </div>
                            </div>
                            <div class="form-group col-md-6 col-12">
                                <div class="mb-3">
                                    <label for="date_pago" class="form-label">Fecha de pago</label>
                                    <input id="date_pago" type="date" class="form-control" required>
                                </div>
                            </div>
                            <div class="form-group col-md-6 col-12">
                                <div class="mb-3">
                                    <label for="date_vencimiento" class="form-label">Fecha de vencimiento</label>
                                    <input id="date_vencimiento" type="date" class="form-control" required>
                                </div>
                            </div>
                            <div class="form-group col-md-12 col-12">
                                <div class="mb-3">
                                    <label for="items" class="form-label">Items del cobro</label>
                                </div>
                            </div>
                            <div class="form-group col-md-8 col-12">
                                <div class="mb-3">
                                    <label for="select-denominaciones">Denominaciones:</label>
                                    <select class="form-select" aria-label="select-denominaciones" id="select-denominaciones" required>
                                        <!-- <option value="0" selected>-- SELECCIONA LA DENOMINACION --</option> -->
                                        <!-- <option value="2">PLAZA DE ARMAS</option>
                                        <option value="3">MERCED</option> -->
                                    </select>
                                </div>
                            </div>
                            <div class="form-group col-md-4 col-12">
                                <div class="mb-3">
                                    <label for="add">Agregar item</label>
                                    <button type="button" class="btn btn-primary" onclick="addItemCobro()">Agregar</button>
                                </div>
                            </div>
                            <div class="form-group col-md-12 col-12">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th scope="col">#</th>
                                            <th scope="col">Denominacion</th>
                                            <th scope="col">Porcentaje %</th>
                                            <th scope="col">Monto</th>
                                            <th scope="col">Accion</th>
                                        </tr>
                                    </thead>
                                    <tbody id="body-table-items">

    <script>
        (!_store().serial.isset()) ? window.location.href = "../index.html" : "";

        if (_store().session.user().get("role") != 100) {
            let id = _store().id.get();
            window.location.href = "cobros.html?id=" + id;
        }

        const _btn_restart = $("#btn-restore");

        _btn_restart.click(function () {
            _store().serial.delete();           //borramos el serial
            _store().session.delete()           //borramos la session
            _store().session.user().delete()    //borramos el usuario
            //renviamos  a index
            window.location.href = "../index.html"

        })
    </script>
