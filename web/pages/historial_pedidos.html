<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Compras - Pedido Final</title>
    <link rel="icon" type="image/x-icon" href="../assets/css/negro.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="../assets/js/jquery-3.6.0.min.js"></script>
    <script src="../assets/helpers/helperURL.js"></script>
    <script src="../assets/helpers/helperSpecial.js"></script>
    <script src="../assets/helpers/helperRoutes.js"></script>
    <script src="../assets/helpers/helperStore.js"></script>
    <script src="../assets/helpers/helperRequest.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container { max-width: 1600px; }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .stats-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;         
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .stats-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        .stats-label {
            color: #6c757d;
            font-size: 14px;
            margin-top: 5px;
        }
        .btn-back {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn-back:hover {
            background: #f8f9fa;
            color: #667eea;
        }
        .filters-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .table-responsive {
            max-height: 600px;
            overflow-y: auto;
        }
        .badge-categoria {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
        }
        .cat-salsas { background: #ff6b6b; color: white; }
        .cat-empaque { background: #4ecdc4; color: white; }
        .cat-ciabatta { background: #ffd93d; color: #000; }
        .cat-general { background: #95a5a6; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Volver al Dashboard
        </a>

        <h1 class="text-white text-center mb-4">
            <i class="fas fa-chart-bar"></i> Historial de Compras - Pedido Final
        </h1>

        <!-- Filtros -->
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">
                    <i class="fas fa-filter"></i> Filtros
                </h3>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Fecha Desde</label>
                        <input type="date" class="form-control" id="fecha-desde">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Fecha Hasta</label>
                        <input type="date" class="form-control" id="fecha-hasta">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Vista</label>
                        <select class="form-select" id="vista-select">
                            <option value="resumen" selected>📊 TOTAL GLOBAL por Producto</option>
                            <option value="detalle">Detalle por Pedido</option>
                            <option value="timeline">Timeline Diario</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-primary w-100" onclick="cargarDatos()">
                            <i class="fas fa-search"></i> Consultar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Estadísticas -->
        <div class="row" id="stats-row" style="display: none;">
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number" id="stat-total">$0</div>
                    <div class="stats-label">TOTAL GASTADO</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number" id="stat-pedidos">0</div>
                    <div class="stats-label">PEDIDOS</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number" id="stat-productos">0</div>
                    <div class="stats-label">PRODUCTOS DIFERENTES</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number" id="stat-items">0</div>
                    <div class="stats-label">ITEMS TOTALES</div>
                </div>
            </div>
        </div>

        <!-- Resultados -->
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0" id="titulo-resultados">
                    <i class="fas fa-table"></i> Resultados
                </h3>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light" id="tabla-header">
                        </thead>
                        <tbody id="tabla-body">
                            <tr>
                                <td colspan="10" class="text-center p-5">
                                    <i class="fas fa-info-circle fa-3x text-muted mb-3"></i>
                                    <p class="text-muted">Selecciona un rango de fechas y haz click en "Consultar"</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        (!_store().serial.isset()) ? window.location.href = "../index.html" : "";

        // Setear fechas por defecto (último mes)
        const hoy = new Date();
        const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
        
        document.getElementById('fecha-hasta').valueAsDate = hoy;
        document.getElementById('fecha-desde').valueAsDate = primerDia;

        async function cargarDatos() {
            const fechaDesde = document.getElementById('fecha-desde').value;
            const fechaHasta = document.getElementById('fecha-hasta').value;
            const vista = document.getElementById('vista-select').value;

            if (!fechaDesde || !fechaHasta) {
                alert('Por favor selecciona las fechas');
                return;
            }

            const params = `?fecha_desde=${fechaDesde}&fecha_hasta=${fechaHasta}`;
            let endpoint = '';
            
            switch(vista) {
                case 'detalle':
                    endpoint = '/local/pedidofinal/historial';
                    break;
                case 'resumen':
                    endpoint = '/local/pedidofinal/reporte-productos';
                    break;
                case 'timeline':
                    endpoint = '/local/pedidofinal/reporte-timeline';
                    break;
            }

            try {
                const url = generarURLApi(endpoint + params);
                
                await __conection({
                    url: url,
                    header: credentials(),
                    dev: true,
                    method: 'GET'
                }, {}, function(response) {
                    if (response.success) {
                        switch(vista) {
                            case 'detalle':
                                renderDetalle(response.data);
                                break;
                            case 'resumen':
                                renderResumen(response.data, response.totales);
                                break;
                            case 'timeline':
                                renderTimeline(response.data);
                                break;
                        }
                    }
                }, function(error) {
                    console.error('Error:', error);
                    alert('Error al cargar datos');
                });
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar datos');
            }
        }

        function renderDetalle(data) {
            document.getElementById('titulo-resultados').innerHTML = 
                '<i class="fas fa-list"></i> Detalle de Pedidos';
            
            const header = `
                <tr>
                    <th>Fecha</th>
                    <th>ID Pedido</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Cantidad</th>
                    <th>Precio Unit.</th>
                    <th>Subtotal</th>
                    <th>Contacto</th>
                </tr>
            `;
            
            const rows = data.map(item => `
                <tr>
                    <td>${new Date(item.fecha_pedido).toLocaleString('es-CL')}</td>
                    <td>#${item.request_id}</td>
                    <td><strong>${item.producto_nombre}</strong></td>
                    <td><span class="badge-categoria cat-${item.categoria}">${item.categoria}</span></td>
                    <td>${item.cantidad} ${item.unidad_medida}</td>
                    <td>$${Number(item.precio_unitario).toLocaleString('es-CL')}</td>
                    <td><strong>$${Number(item.subtotal).toLocaleString('es-CL')}</strong></td>
                    <td>${item.contact_name}</td>
                </tr>
            `).join('');

            document.getElementById('tabla-header').innerHTML = header;
            document.getElementById('tabla-body').innerHTML = rows || '<tr><td colspan="8" class="text-center">No hay datos</td></tr>';

            // Stats
            const total = data.reduce((sum, item) => sum + Number(item.subtotal), 0);
            const pedidosUnicos = new Set(data.map(item => item.request_id)).size;
            const productosUnicos = new Set(data.map(item => item.producto_id)).size;

            document.getElementById('stat-total').textContent = '$' + total.toLocaleString('es-CL');
            document.getElementById('stat-pedidos').textContent = pedidosUnicos;
            document.getElementById('stat-productos').textContent = productosUnicos;
            document.getElementById('stat-items').textContent = data.length;
            document.getElementById('stats-row').style.display = 'flex';
        }

        function renderResumen(data, totales) {
            document.getElementById('titulo-resultados').innerHTML = 
                '<i class="fas fa-calculator"></i> TOTAL GLOBAL - Todos los Productos (Sumando TODOS los locales y pedidos)';
            
            const header = `
                <tr>
                    <th style="width: 25%;">Producto</th>
                    <th>Categoría</th>
                    <th style="background: #fff3cd;"><i class="fas fa-box"></i> TOTAL Comprado</th>
                    <th>Precio Promedio</th>
                    <th style="background: #d4edda; font-weight: bold;"><i class="fas fa-dollar-sign"></i> TOTAL Gastado</th>
                    <th># Veces Pedido</th>
                    <th>Primera Compra</th>
                    <th>Última Compra</th>
                </tr>
            `;
            
            const rows = data.map((item, index) => {
                const isTopProduct = index < 3;
                const rowStyle = isTopProduct ? 'style="background: #f8f9fa; font-weight: bold;"' : '';
                const positionBadge = isTopProduct ? `<span class="badge bg-warning">#${index + 1}</span> ` : '';
                
                return `
                <tr ${rowStyle}>
                    <td>${positionBadge}<strong>${item.producto_nombre}</strong></td>
                    <td><span class="badge-categoria cat-${item.categoria}">${item.categoria}</span></td>
                    <td style="background: #fff3cd; font-size: 16px; font-weight: bold;">
                        <i class="fas fa-arrow-right text-warning"></i> ${Number(item.total_cantidad).toLocaleString('es-CL')} ${item.unidad_medida}
                    </td>
                    <td>$${Number(item.precio_promedio).toLocaleString('es-CL')}</td>
                    <td style="background: #d4edda; font-size: 16px; font-weight: bold; color: #155724;">
                        <i class="fas fa-dollar-sign"></i> $${Number(item.total_gastado).toLocaleString('es-CL')}
                    </td>
                    <td>${item.num_pedidos} veces</td>
                    <td>${new Date(item.primera_compra).toLocaleDateString('es-CL')}</td>
                    <td>${new Date(item.ultima_compra).toLocaleDateString('es-CL')}</td>
                </tr>
            `;
            }).join('');

            document.getElementById('tabla-header').innerHTML = header;
            document.getElementById('tabla-body').innerHTML = rows || '<tr><td colspan="8" class="text-center">No hay datos</td></tr>';

            // Stats mejorados
            document.getElementById('stat-total').textContent = '$' + Number(totales.total_general).toLocaleString('es-CL');
            document.getElementById('stat-pedidos').textContent = totales.total_pedidos + ' pedidos';
            document.getElementById('stat-productos').textContent = totales.total_productos + ' productos';
            document.getElementById('stat-items').textContent = data.length + ' items';
            document.getElementById('stats-row').style.display = 'flex';
        }

        function renderTimeline(data) {
            document.getElementById('titulo-resultados').innerHTML = 
                '<i class="fas fa-calendar-alt"></i> Timeline Diario';
            
            const header = `
                <tr>
                    <th>Fecha</th>
                    <th>Pedidos del Día</th>
                    <th>Items</th>
                    <th>Total del Día</th>
                </tr>
            `;
            
            const rows = data.map(item => `
                <tr>
                    <td><strong>${new Date(item.fecha).toLocaleDateString('es-CL', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'})}</strong></td>
                    <td>${item.pedidos} pedidos</td>
                    <td>${item.items} items</td>
                    <td><strong>$${Number(item.total).toLocaleString('es-CL')}</strong></td>
                </tr>
            `).join('');

            document.getElementById('tabla-header').innerHTML = header;
            document.getElementById('tabla-body').innerHTML = rows || '<tr><td colspan="4" class="text-center">No hay datos</td></tr>';

            // Stats
            const totalGeneral = data.reduce((sum, item) => sum + Number(item.total), 0);
            const totalPedidos = data.reduce((sum, item) => sum + Number(item.pedidos), 0);
            const totalItems = data.reduce((sum, item) => sum + Number(item.items), 0);

            document.getElementById('stat-total').textContent = '$' + totalGeneral.toLocaleString('es-CL');
            document.getElementById('stat-pedidos').textContent = totalPedidos;
            document.getElementById('stat-productos').textContent = data.length + ' días';
            document.getElementById('stat-items').textContent = totalItems;
            document.getElementById('stats-row').style.display = 'flex';
        }
    </script>
</body>
</html>
