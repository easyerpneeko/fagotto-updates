                    <!--Modal guia despacho-->
                    <div style="" class="modal fade" id="newGuiaDespachoModal" tabindex="-1" role="dialog"
                        aria-labelledby="clientCreate" aria-hidden="true" data-backdrop="false">
                        <div class="modal-dialog modal-md modal-dialog-centered" role="document">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Creando: Guia de Despacho</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body row">

                                    <div class="form-group col-md-6 col-12">
                                        <label for="tipo-despacho">Despacho por cuenta de:</label>
                                        <!-- <select class="form-control" id="tipo-despacho" v-model="TipoDespacho">
                                        <option value="1" selected>Receptor</option>
                                        <option value="2">Emisor</option>
                                        <option value="3">Tercero</option>
                                    </select> -->
                                        <select class="form-select" aria-label="tipo-despacho" id="tipo-despacho"
                                            v-model="TipoDespacho">
                                            <option value="1" selected>Receptor</option>
                                            <option value="2">Emisor</option>
                                            <option value="3">Tercero</option>
                                        </select>
                                    </div>
                                    <div class="form-group col-md-6 col-12">
                                        <div class="mb-3">
                                            <label for="translado">Translado</label>
                                            <!-- <select class="form-control" id="Translado" v-model="Translado">
                                            <option value="1" selected>Operacion Constituyente</option>
                                            <option value="2">Venta por Efectuar</option>
                                            <option value="3">Consignacion</option>
                                            <option value="4">Entrega gratuita</option>
                                            <option value="5">Traslados internos</option>
                                            <option value="6">Otro traslado (no venta)</option>
                                            <option value="7">Guía de devolución</option>
                                            <option value="8">Traslado para exportación. (no venta)</option>
                                            <option value="9">Venta para exportación</option>
                                        </select> -->
                                            <select class="form-select" aria-label="traslado" id="traslado"
                                                v-model="traslado">
                                                <option value="1" selected>Operacion Constituyente</option>
                                                <option value="2">Venta por Efectuar</option>
                                                <option value="3">Consignacion</option>
                                                <option value="4">Entrega gratuita</option>
                                                <option value="5">Traslados internos</option>
                                                <option value="6">Otro traslado (no venta)</option>
                                                <option value="7">Guía de devolución</option>
                                                <option value="8">Traslado para exportación. (no venta)</option>
                                                <option value="9">Venta para exportación</option>
                                            </select>

                                        </div>
                                    </div>

                                    <div class="form-group col-md-6 col-12">
                                        <div class="mb-3">
                                            <label for="rut" class="form-label">Rut del cliente</label>
                                            <input id="rut" @change="serchClient(false)" type="text"
                                                class="form-control"
                                                :class="['form-control', (rut != '' || rut != null) ? 'text-uppercase' : ''] "
                                                placeholder="Rut del cliente" :disabled="waitResponse" v-model="rut"
                                                @keyup.enter="newClient" maxlength="10">
                                        </div>
                                    </div>
                                    <div v-if="clientsPhone" class="form-group col-12">
                                        <div class="mb-3">
                                            <label for="phone" class="form-label">Telefono</label>
                                            <input id="phone" type="text" class="form-control" placeholder="Telefono"
                                                :disabled="waitResponse" v-model="phone" @keyup.enter="newClient"
                                                maxlength="20">
                                        </div>
                                    </div>
                                    <div class="form-group col-md-6 col-12">
                                        <div class="mb-3">
                                            <label for="razon_social" class="form-label">Razon social</label>
                                            <input id="razon_social" type="text" class="form-control"
                                                placeholder="Razon social" :disabled="waitResponse"
                                                v-model="razon_social" @keyup.enter="newClient" maxlength="100">
                                        </div>
                                    </div>
                                    <div class="form-group col-md-6 col-12" v-if="siiInstalado">
                                        <div class="mb-3">
                                            <label for="direction" class="form-label">Dirección</label>
                                            <input id="direction" type="text" class="form-control"
                                                placeholder="Dirección" :disabled="waitResponse" v-model="direction"
                                                @keyup.enter="newClient" maxlength="70">
                                        </div>
                                    </div>
                                    <div class="form-group col-md-6 col-12" v-if="siiInstalado">
                                        <div class="mb-3">
                                            <label for="giro" class="form-label">Giro del receptor</label>
                                            <input id="giro" type="text" class="form-control"
                                                placeholder="Giro del receptor" :disabled="waitResponse" v-model="giro"
                                                @keyup.enter="newClient" maxlength="80">
                                        </div>
                                    </div>
                                    <div class="form-group col-md-6 col-12">
                                        <div class="mb-3">
                                            <label for="city" class="form-label">Ciudad</label>
                                            <input id="city" type="text" class="form-control" placeholder="Ciudad"
                                                :disabled="waitResponse" v-model="city" @keyup.enter="newClient"
                                                maxlength="20">
                                        </div>
                                    </div>
                                    <div class="form-group col-md-6 col-12">
                                        <div class="mb-3">
                                            <label for="comuna" class="form-label">Comuna</label>
                                            <input id="comuna" type="text" class="form-control" placeholder="Comuna"
                                                :disabled="waitResponse" v-model="comuna" @keyup.enter="newClient"
                                                maxlength="20">
                                        </div>
                                    </div>
                                    <div class="form-group col-md-6 col-12" hidden="true">
                                        <div class="mb-3">
                                            <label for="observacion" class="form-label">Observacion</label>
                                            <input id="observacion" type="text" class="form-control"
                                                placeholder="Observacion" :disabled="waitResponse" v-model="observacion"
                                                @keyup.enter="newClient" maxlength="20">
                                        </div>
                                    </div>
                                    <div class="form-group col-md-6 col-12">
                                        <div class="mb-3">
                                            <label for="folio-ref" class="form-label">Referencia</label>
                                            <input id="folio-ref" type="text" class="form-control"
                                                placeholder="Referencia de Folio" :disabled="waitResponse"
                                                v-model="comment" maxlength="18">
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-info" data-bs-dismiss="modal">Cerrar</button>
                                    <button type="button" class="btn btn-primary">Crear Guia de Despacho</button>
                                </div>
                            </div>

    <script>
        (!_store().serial.isset()) ? window.location.href = "../index.html" : "";

        const _btn_restart = $("#btn-restore");

        _btn_restart.click(function () {
            _store().serial.delete();           //borramos el serial
            _store().session.delete()           //borramos la session
            _store().session.user().delete()    //borramos el usuario
            //renviamos  a index
            window.location.href = "../index.html"

        })
