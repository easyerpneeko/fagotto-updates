<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Panel Administrativo - Arqueos de Caja</title>
    
    <!-- Favicon fix -->
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,AAABAAEAEBAAAAAAAABoBQAAFgAAACgAAAAQAAAAIAAAAAEACAAAAAAAAAEAAAAAAAAAAAAAAAEAAAAAAAAAAAAA">
    
    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Moment.js para fechas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
        <link rel="icon" type="image/x-icon" href="../assets/css/negro.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/garzon.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <script src="../assets/js/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
    <!--helpers-->
    <script src="../assets/helpers/helperURL.js"></script>
    <script src="../assets/helpers/helperSpecial.js"></script>
    <script src="../assets/helpers/helperRoutes.js"></script>
    <script src="../assets/helpers/helperStore.js"></script>
    <script src="../assets/helpers/helperRequest.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            margin: 20px;
            padding: 30px;
        }
        
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .stats-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .stats-card:hover {
            transform: translateY(-5px);
        }
        
        .stats-card.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .stats-card.warning {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        
        .stats-card.danger {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #333;
        }
        
        .filter-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .arqueo-card {
            background: white;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        
        .arqueo-card:hover {
            transform: translateX(5px);
        }
        
        .arqueo-card.perfecto {
            border-left-color: #28a745;
        }
        
        .arqueo-card.sobrante {
            border-left-color: #ffc107;
        }
        
        .arqueo-card.faltante {
            border-left-color: #dc3545;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 10px 25px;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner-border {
            color: #667eea;
        }
        
        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .badge-estado {
            font-size: 0.9em;
            padding: 8px 15px;
            border-radius: 20px;
        }
        
        .badge-perfecto {
            background-color: #28a745;
        }
        
        .badge-sobrante {
            background-color: #ffc107;
            color: #333;
        }
        
        .badge-faltante {
            background-color: #dc3545;
        }
        
        .detail-modal .modal-content {
            border-radius: 15px;
        }
        
        .detail-modal .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
        }
        
        @media (max-width: 768px) {
            .main-container {
                margin: 10px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="page-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1><i class="fas fa-chart-line me-3"></i>Panel Administrativo de Arqueos</h1>
                    <p class="mb-0">Gestión centralizada de arqueos de caja de todos los locales</p>
                </div>
                <div>
                    <button class="btn btn-outline-light" onclick="refreshData()">
                        <i class="fas fa-sync-alt"></i> Actualizar
                    </button>
                </div>
            </div>
        </div>

        <!-- Dashboard de Estadísticas -->
        <div class="row" id="dashboard-stats">
            <!-- Las estadísticas se cargan aquí dinámicamente -->
        </div>

        <!-- Filtros -->
        <div class="filter-section">
            <h5><i class="fas fa-filter me-2"></i>Filtros de Búsqueda</h5>
            <div class="row">
                <div class="col-md-3">
                    <label>Local/Negocio:</label>
                    <select id="filter-local" class="form-control">
                        <option value="">Todos los locales</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Fecha Inicio:</label>
                    <input type="date" id="filter-fecha-inicio" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>Fecha Fin:</label>
                    <input type="date" id="filter-fecha-fin" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>Estado:</label>
                    <select id="filter-estado" class="form-control">
                        <option value="">Todos los estados</option>
                        <option value="perfecto">✅ Perfecto</option>
                        <option value="sobrante">⚠️ Sobrante</option>
                        <option value="faltante">❌ Faltante</option>
                    </select>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-3">
                    <label>Usuario:</label>
                    <select id="filter-usuario" class="form-control">
                        <option value="">Todos los usuarios</option>
                    </select>
                </div>
                <div class="col-md-9 d-flex align-items-end">
                    <button class="btn btn-primary mr-2" onclick="aplicarFiltros()">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                    <button class="btn btn-outline-secondary mr-2" onclick="limpiarFiltros()">
                        <i class="fas fa-eraser"></i> Limpiar
                    </button>
                    <button class="btn btn-success" onclick="exportarExcel()">
                        <i class="fas fa-file-excel"></i> Exportar Excel
                    </button>
                </div>
            </div>
        </div>

        <!-- Gráficos -->
        <div class="row">
            <div class="col-md-6">
                <div class="chart-container">
                    <h5><i class="fas fa-chart-pie me-2"></i>Distribución de Estados</h5>
                    <canvas id="chartEstados"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-container">
                    <h5><i class="fas fa-chart-bar me-2"></i>Arqueos por Día</h5>
                    <canvas id="chartPorDia"></canvas>
                </div>
            </div>
        </div>

        <!-- Tabla de Arqueos -->
        <div class="filter-section">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5><i class="fas fa-table me-2"></i>Lista de Arqueos</h5>
                <span id="total-registros" class="badge badge-info">Cargando...</span>
            </div>
            
            <div class="loading-spinner" id="loading-spinner">
                <div class="spinner-border" role="status">
                    <span class="sr-only">Cargando...</span>
                </div>
                <p class="mt-2">Cargando arqueos...</p>
            </div>
            
            <div id="arqueos-list">
                <!-- Los arqueos se cargan aquí dinámicamente -->
            </div>
            
            <!-- Paginación -->
            <nav id="pagination-nav" style="display: none;">
                <ul class="pagination justify-content-center" id="pagination-list">
                    <!-- Los enlaces de paginación se cargan aquí -->
                </ul>
            </nav>
        </div>
    </div>

    <!-- Modal de Detalle -->
    <div class="modal fade detail-modal" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-info-circle me-2"></i>Detalle del Arqueo
                    </h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span class="text-white">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="detail-content">
                    <!-- El contenido se carga dinámicamente -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" onclick="imprimirDetalle()">
                        <i class="fas fa-print"></i> Imprimir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <script>
        // 🔧 Configuración global
        const API_BASE_URL = 'https://posfagotto.cl'; // Usar URL directa en lugar de helperURL
        let currentPage = 1;
        let currentFilters = {};
        let chartEstados = null;
        let chartPorDia = null;

        // 🚀 Inicialización
        $(document).ready(function() {
            console.log('🚀 Iniciando Panel Administrativo de Arqueos...');
            initializePage();
        });

        async function initializePage() {
            try {
                // Establecer fechas por defecto
                const hoy = new Date();
                const primerDiaMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
                
                $('#filter-fecha-inicio').val(primerDiaMes.toISOString().split('T')[0]);
                $('#filter-fecha-fin').val(hoy.toISOString().split('T')[0]);

                // Cargar datos iniciales
                await Promise.all([
                    cargarLocales(),
                    cargarUsuarios(),
                    cargarDashboard(),
                    cargarArqueos()
                ]);

                console.log('✅ Panel administrativo inicializado correctamente');
            } catch (error) {
                console.error('❌ Error inicializando panel:', error);
                mostrarError('Error cargando el panel administrativo');
            }
        }

        // 📊 Cargar dashboard de estadísticas
        async function cargarDashboard() {
            try {
                const fechaInicio = $('#filter-fecha-inicio').val();
                const fechaFin = $('#filter-fecha-fin').val();
                
                const response = await fetch(`${API_BASE_URL}/api/local/admin/arqueos/dashboard?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                const result = await response.json();
                
                if (result.success) {
                    mostrarEstadisticas(result.data.estadisticas_generales);
                    actualizarGraficos(result.data);
                } else {
                    console.error('Error cargando dashboard:', result.message);
                }
            } catch (error) {
                console.error('Error en cargarDashboard:', error);
            }
        }

        // 📈 Mostrar estadísticas en cards
        function mostrarEstadisticas(stats) {
            const html = `
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="h3">${stats.total_arqueos}</div>
                        <div>Total Arqueos</div>
                        <i class="fas fa-calculator fa-2x mt-2"></i>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card success">
                        <div class="h3">${stats.arqueos_perfectos}</div>
                        <div>Arqueos Perfectos</div>
                        <i class="fas fa-check-circle fa-2x mt-2"></i>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card warning">
                        <div class="h3">${stats.arqueos_con_diferencias}</div>
                        <div>Con Diferencias</div>
                        <i class="fas fa-exclamation-triangle fa-2x mt-2"></i>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card danger">
                        <div class="h3">$${formatMoney(stats.total_ventas_periodo)}</div>
                        <div>Total Ventas</div>
                        <i class="fas fa-dollar-sign fa-2x mt-2"></i>
                    </div>
                </div>
            `;
            
            $('#dashboard-stats').html(html);
        }

        // 📊 Actualizar gráficos
        function actualizarGraficos(data) {
            // Gráfico de estados (pie)
            const ctxEstados = document.getElementById('chartEstados').getContext('2d');
            if (chartEstados) chartEstados.destroy();
            
            chartEstados = new Chart(ctxEstados, {
                type: 'pie',
                data: {
                    labels: ['Perfectos', 'Sobrantes', 'Faltantes'],
                    datasets: [{
                        data: [
                            data.estadisticas_generales.arqueos_perfectos,
                            data.estadisticas_generales.arqueos_con_diferencias / 2, // Aproximado
                            data.estadisticas_generales.arqueos_con_diferencias / 2
                        ],
                        backgroundColor: ['#28a745', '#ffc107', '#dc3545']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });

            // Gráfico por día (bar)
            const ctxPorDia = document.getElementById('chartPorDia').getContext('2d');
            if (chartPorDia) chartPorDia.destroy();
            
            chartPorDia = new Chart(ctxPorDia, {
                type: 'bar',
                data: {
                    labels: data.por_dia.map(d => moment(d.fecha).format('DD/MM')),
                    datasets: [{
                        label: 'Arqueos por Día',
                        data: data.por_dia.map(d => d.total_arqueos),
                        backgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // 🏪 Cargar locales para filtros
        async function cargarLocales() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/local/admin/locales`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                const result = await response.json();
                
                if (result.success) {
                    const select = $('#filter-local');
                    select.empty().append('<option value="">Todos los locales</option>');
                    
                    result.data.forEach(local => {
                        select.append(`<option value="${local.app_id}">${local.nombre} - ${local.nombre_publico}</option>`);
                    });
                }
            } catch (error) {
                console.error('Error cargando locales:', error);
            }
        }

        // 👥 Cargar usuarios para filtros
        async function cargarUsuarios() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/local/admin/usuarios-arqueos`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                const result = await response.json();
                
                if (result.success) {
                    const select = $('#filter-usuario');
                    select.empty().append('<option value="">Todos los usuarios</option>');
                    
                    result.data.forEach(usuario => {
                        select.append(`<option value="${usuario.usuario_id}">${usuario.nombre} (${usuario.total_arqueos} arqueos)</option>`);
                    });
                }
            } catch (error) {
                console.error('Error cargando usuarios:', error);
            }
        }

        // 📋 Cargar lista de arqueos
        async function cargarArqueos(page = 1) {
            try {
                $('#loading-spinner').show();
                $('#arqueos-list').hide();

                const params = new URLSearchParams({
                    page: page,
                    limit: 10,
                    ...currentFilters
                });

                const response = await fetch(`${API_BASE_URL}/api/local/admin/arqueos?${params}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                const result = await response.json();
                
                if (result.success) {
                    mostrarArqueos(result.data.arqueos);
                    actualizarPaginacion(result.data.arqueos);
                    $('#total-registros').text(`${result.data.arqueos.total} registros encontrados`);
                } else {
                    mostrarError('Error cargando arqueos: ' + result.message);
                }
            } catch (error) {
                console.error('Error cargando arqueos:', error);
                mostrarError('Error de conexión al cargar arqueos');
            } finally {
                $('#loading-spinner').hide();
                $('#arqueos-list').show();
            }
        }

        // 🎨 Mostrar lista de arqueos
        function mostrarArqueos(arqueos) {
            if (!arqueos.data || arqueos.data.length === 0) {
                $('#arqueos-list').html(`
                    <div class="text-center py-5">
                        <i class="fas fa-search fa-3x text-muted"></i>
                        <p class="mt-3">No se encontraron arqueos con los filtros seleccionados</p>
                    </div>
                `);
                return;
            }

            let html = '';
            arqueos.data.forEach(arqueo => {
                const fechaInicio = moment(arqueo.fecha_inicio).format('DD/MM/YYYY HH:mm');
                const fechaTermino = arqueo.fecha_termino ? moment(arqueo.fecha_termino).format('DD/MM/YYYY HH:mm') : 'En proceso';
                const estado = arqueo.estado || 'cerrado';
                const diferencia = parseFloat(arqueo.diferencia_general || 0);
                
                html += `
                    <div class="arqueo-card ${estado}">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-3">
                                    <h6><i class="fas fa-store me-2"></i>${arqueo.nombre_local || 'Local N/A'}</h6>
                                    <small class="text-muted">${arqueo.nombre_publico_local || ''}</small>
                                    <br>
                                    <small><i class="fas fa-user me-1"></i>${arqueo.nombre_usuario || 'Usuario N/A'}</small>
                                </div>
                                <div class="col-md-3">
                                    <strong>Fecha Inicio:</strong><br>
                                    <small>${fechaInicio}</small><br>
                                    <strong>Fecha Cierre:</strong><br>
                                    <small>${fechaTermino}</small>
                                </div>
                                <div class="col-md-3">
                                    <strong>Monto Inicial:</strong> $${formatMoney(arqueo.monto_inicial || 0)}<br>
                                    <strong>Total Contado:</strong> $${formatMoney(arqueo.total_general_contado || 0)}<br>
                                    <strong>Total Sistema:</strong> $${formatMoney(arqueo.total_sistema || 0)}
                                </div>
                                <div class="col-md-3 text-right">
                                    <span class="badge badge-estado badge-${estado}">
                                        ${estado.toUpperCase()}
                                    </span>
                                    <br><br>
                                    <strong class="h5 ${diferencia >= 0 ? 'text-success' : 'text-danger'}">
                                        ${diferencia >= 0 ? '+' : ''}$${formatMoney(Math.abs(diferencia))}
                                    </strong>
                                    <br>
                                    <button class="btn btn-sm btn-outline-primary mt-2" onclick="verDetalle(${arqueo.id})">
                                        <i class="fas fa-eye"></i> Ver Detalle
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            $('#arqueos-list').html(html);
        }

        // 🔍 Ver detalle de arqueo
        async function verDetalle(arqueoId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/local/admin/arqueos/detalle/${arqueoId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                const result = await response.json();
                
                if (result.success) {
                    mostrarModalDetalle(result.data);
                } else {
                    mostrarError('Error cargando detalle: ' + result.message);
                }
            } catch (error) {
                console.error('Error cargando detalle:', error);
                mostrarError('Error de conexión al cargar detalle');
            }
        }

        // 📝 Mostrar modal de detalle
        function mostrarModalDetalle(arqueo) {
            const fechaInicio = moment(arqueo.fecha_inicio).format('DD/MM/YYYY HH:mm:ss');
            const fechaTermino = arqueo.fecha_termino ? moment(arqueo.fecha_termino).format('DD/MM/YYYY HH:mm:ss') : 'En proceso';
            
            // Generar detalle de efectivo
            let detalleEfectivo = '';
            if (arqueo.detalle_efectivo_decoded) {
                detalleEfectivo = '<h6>Detalle de Efectivo:</h6><ul>';
                Object.entries(arqueo.detalle_efectivo_decoded).forEach(([denominacion, info]) => {
                    detalleEfectivo += `<li><strong>${denominacion}:</strong> ${info.cantidad} x $${formatMoney(info.valor)} = $${formatMoney(info.subtotal)}</li>`;
                });
                detalleEfectivo += '</ul>';
            }

            // Generar detalle de medios de pago
            let detalleMedios = '';
            if (arqueo.detalle_medios_pago_decoded) {
                detalleMedios = '<h6>Otros Medios de Pago:</h6><ul>';
                Object.entries(arqueo.detalle_medios_pago_decoded).forEach(([metodo, monto]) => {
                    if (monto > 0) {
                        detalleMedios += `<li><strong>${metodo}:</strong> $${formatMoney(monto)}</li>`;
                    }
                });
                detalleMedios += '</ul>';
            }

            const html = `
                <div class="row">
                    <div class="col-md-6">
                        <h6><i class="fas fa-store me-2"></i>Información del Local</h6>
                        <p><strong>Nombre:</strong> ${arqueo.nombre_local}<br>
                        <strong>Nombre Público:</strong> ${arqueo.nombre_publico_local}</p>
                        
                        <h6><i class="fas fa-user me-2"></i>Usuario</h6>
                        <p><strong>Nombre:</strong> ${arqueo.nombre_completo_usuario || arqueo.nombre_usuario}<br>
                        <strong>Usuario:</strong> ${arqueo.nombre_usuario}</p>
                    </div>
                    <div class="col-md-6">
                        <h6><i class="fas fa-clock me-2"></i>Información del Turno</h6>
                        <p><strong>Inicio:</strong> ${fechaInicio}<br>
                        <strong>Cierre:</strong> ${fechaTermino}<br>
                        <strong>Estado:</strong> <span class="badge badge-${arqueo.estado}">${arqueo.estado.toUpperCase()}</span></p>
                        
                        <h6><i class="fas fa-dollar-sign me-2"></i>Resumen Financiero</h6>
                        <p><strong>Monto Inicial:</strong> $${formatMoney(arqueo.monto_inicial || 0)}<br>
                        <strong>Total Contado:</strong> $${formatMoney(arqueo.total_general_contado || 0)}<br>
                        <strong>Total Sistema:</strong> $${formatMoney(arqueo.total_sistema || 0)}<br>
                        <strong>Diferencia:</strong> <span class="${(arqueo.diferencia_general || 0) >= 0 ? 'text-success' : 'text-danger'}">${(arqueo.diferencia_general || 0) >= 0 ? '+' : ''}$${formatMoney(Math.abs(arqueo.diferencia_general || 0))}</span></p>
                    </div>
                </div>
                
                <hr>
                
                <div class="row">
                    <div class="col-md-6">
                        ${detalleEfectivo}
                    </div>
                    <div class="col-md-6">
                        ${detalleMedios}
                    </div>
                </div>
                
                ${arqueo.observaciones ? `<hr><h6>Observaciones:</h6><p>${arqueo.observaciones}</p>` : ''}
            `;

            $('#detail-content').html(html);
            $('#detailModal').modal('show');
        }

        // 🔍 Aplicar filtros
        function aplicarFiltros() {
            currentFilters = {
                app_id: $('#filter-local').val(),
                fecha_inicio: $('#filter-fecha-inicio').val(),
                fecha_fin: $('#filter-fecha-fin').val(),
                estado: $('#filter-estado').val(),
                usuario_id: $('#filter-usuario').val()
            };

            // Remover filtros vacíos
            Object.keys(currentFilters).forEach(key => {
                if (!currentFilters[key]) {
                    delete currentFilters[key];
                }
            });

            currentPage = 1;
            cargarArqueos(1);
            cargarDashboard(); // Actualizar dashboard con filtros
        }

        // 🧹 Limpiar filtros
        function limpiarFiltros() {
            $('#filter-local').val('');
            $('#filter-fecha-inicio').val('');
            $('#filter-fecha-fin').val('');
            $('#filter-estado').val('');
            $('#filter-usuario').val('');
            
            currentFilters = {};
            currentPage = 1;
            cargarArqueos(1);
            cargarDashboard();
        }

        // 🔄 Actualizar datos
        function refreshData() {
            initializePage();
        }

        // 📊 Exportar a Excel (placeholder)
        function exportarExcel() {
            alert('🚧 Función de exportación en desarrollo');
            // Aquí implementarías la exportación real
        }

        // 🖨️ Imprimir detalle (placeholder)
        function imprimirDetalle() {
            window.print();
        }

        // 📄 Actualizar paginación
        function actualizarPaginacion(paginationData) {
            if (paginationData.last_page <= 1) {
                $('#pagination-nav').hide();
                return;
            }

            $('#pagination-nav').show();
            let paginationHtml = '';
            
            // Botón anterior
            if (paginationData.current_page > 1) {
                paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="cargarArqueos(${paginationData.current_page - 1})">Anterior</a></li>`;
            }

            // Páginas
            for (let i = Math.max(1, paginationData.current_page - 2); i <= Math.min(paginationData.last_page, paginationData.current_page + 2); i++) {
                paginationHtml += `<li class="page-item ${i === paginationData.current_page ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="cargarArqueos(${i})">${i}</a>
                </li>`;
            }

            // Botón siguiente
            if (paginationData.current_page < paginationData.last_page) {
                paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="cargarArqueos(${paginationData.current_page + 1})">Siguiente</a></li>`;
            }

            $('#pagination-list').html(paginationHtml);
        }

        // 💰 Formatear dinero
        function formatMoney(amount) {
            return new Intl.NumberFormat('es-CL').format(amount);
        }

        // ⚠️ Mostrar error
        function mostrarError(mensaje) {
            alert('❌ ' + mensaje);
            console.error(mensaje);
        }
    </script>
</body>
