        .text-label {

    <header class="navbar navbar-dawrk sticky-top bg-primary flex-md-nowrap p-0 shadow"

    <div class="container-fluid">
        <div class="row">
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3" style="overflow-y: scroll; height:800px;">
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./dashboard.html">

                                Tablero
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./sells.html">

                            </a>
                        </li>

                    </ul>
                    <h6
                        class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                        <span>Sucursales</span>
                        <a class="link-secondary" href="#" aria-label="Add a new report">
                            <span data-feather="plus-circle"></span>
                        </a>
                    </h6>
                    <ul class="nav flex-column mb-2 list-group" id="sucursales-list">

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">

                <!-- TOOLBAR -->
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Ventas</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="d-flex justify-content-start align-items-center gap-4 mr-5">
                            <label for="Category">Tipo: </label>
                            <select class="form-control mr-5" style="min-width: 15rem; margin-right: 5rem;" id="typeSell">
                                <option value="null" class="text-capitalize">Todas</option>
                            </select>
                        </div>

                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="getThisDay()">
                                <span data-feather="calendar"></span>
                                Este dia
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="getThisWeek()">
                                <span data-feather="calendar"></span>
                                Esta semana
                            </button>
                            <!-- <button type="button" class="btn btn-sm btn-outline-secondary">
                                <span data-feather="calendar"></span>
                                Este mes
                            </button> -->
                        </div>

                        <div class="d-flex justify-content-start align-items-center gap-2 mr-1">
                            <label for="start">Desde:</label>
                            <input type="date" id="startDate" class="form-control">

                            <label for="end">Hasta:</label>
                            <input type="date" id="endDate" class="form-control">

                            <button type="button" class="btn btn-primary form-control"
                                onclick="getByDate()">Buscar</button>
                            
                            <button type="button" class="btn btn-success form-control"
                                onclick="exportVentasPorHora()" title="Exportar ventas agrupadas por hora">
                                <i class="fas fa-file-excel"></i> Excel x Hora
                            </button>
                        </div>
                    </div>
                </div>


                <div class="row d-flex justify-content-between">
                    <div class="col-12 card p-0">
                        <div class="card-header text-white bg-primary">
                            <h5>Ventas</h5>
                        </div>
                        <div class="card-body">
                            <div id="tablas-container">
                                <h4>Noticias</h4>
                                <p>
                                    En esta seccion estaran las noticias concernientes a los Ventas, para estar al
                                    tanto de los ultimos cambios e informacion relevante
                                </p>
                            </div>
                            <div class="card-footer" id="footer-container">
                                <nav aria-label="pagination">
                                    <ul class="pagination" id="pagination">
                                        <!-- <li class="page-item"><a class="page-link" href="#">Previa</a></li>
                                        <li class="page-item"><a class="page-link" href="#">1</a></li>
                                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                                        <li class="page-item"><a class="page-link" href="#">Siguiente</a></li> -->
                                    </ul>
                                </nav>
                            </div>
                        </div>

                    </div>
                    <!-- Button trigger modal -->


                    <!-- Modal -->
                    <div class="modal fade" id="productsModal" tabindex="-1" aria-labelledby="productsModalLabel"
                        aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h1 class="modal-title fs-5" id="productsModalLabel">Pedido # - 0</h1>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="row d-flex">
                                                <div class="col-md-12">
                                                    <ul class="list-group" id="data-pedido">
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <table class="table table-striped">
                                                <thead>
                                                    <tr>
                                                        <th scope="col">#</th>
                                                        <th scope="col">PRODUCTO</th>
                                                        <th scope="col">CANT</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="table-products">

                                                </tbody>
                                                <tfoot>
                                                    <tr class="table-dark">
                                                        <td colspan="3"><b>TOTAL: </b> <b id="total"></b></td>
                                                    </tr>
                                                </tfoot>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-primary"
                                        data-bs-dismiss="modal">Cerrar</button>
                                    <!-- <button type="button" class="btn btn-primary">Save changes</button> -->
                                </div>
                            </div>
                        </div>
                    </div>

    <script>
        (!_store().serial.isset()) ? window.location.href = "../index.html" : "";

        const _btn_restart = $("#btn-restore");

        _btn_restart.click(function () {
            _store().serial.delete();           //borramos el serial
            _store().session.delete()           //borramos la session
            _store().session.user().delete()    //borramos el usuario
            //renviamos  a index
            window.location.href = "../index.html"

        })

        
    </script>
