<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas por Hora - Sistema ERP</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            min-height: 100vh;
        }

        .modern-header {
            background: var(--card-background);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .modern-header .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .content-wrapper {
            padding: 2rem 0;
            min-height: calc(100vh - 80px);
        }

        .modern-card {
            background: var(--card-background);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .modern-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .modern-card h5 {
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .form-control-modern {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: var(--card-background);
        }

        .form-control-modern:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgb(37 99 235 / 0.25);
            background: #ffffff;
        }

        .btn-modern {
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary-modern {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary-modern:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            color: white;
        }

        .btn-success-modern {
            background: var(--success-color);
            color: white;
        }

        .btn-success-modern:hover {
            background: #059669;
            transform: translateY(-1px);
            color: white;
        }

        .table-modern {
            background: var(--card-background);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table-modern thead th {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .table-modern tbody td {
            border: none;
            padding: 1rem 0.75rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .table-modern tbody tr:last-child td {
            border-bottom: none;
        }

        .table-modern tbody tr:hover {
            background: #f8fafc;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary-color), #3b82f6);
            color: white;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.95rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin: 1rem 0;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 3rem;
        }

        .loading-spinner.show {
            display: block;
        }

        .hora-highlight {
            background: linear-gradient(90deg, var(--success-color), #34d399);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .monto-highlight {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--success-color);
        }

        @media (max-width: 768px) {
            .content-wrapper {
                padding: 1rem;
            }
            
            .modern-card {
                padding: 1.5rem;
                margin-bottom: 1rem;
            }
            
            .stat-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="modern-header">
        <div class="container-fluid">
            <nav class="navbar navbar-expand-lg">
                <a class="navbar-brand" href="#" id="app-name">
                    <i class="fas fa-clock"></i>
                    Ventas por Hora
                </a>
                <div class="ms-auto">
                    <button class="btn btn-outline-primary btn-modern" onclick="window.location.href='sucursal.html?id=' + new URLSearchParams(window.location.search).get('id')">
                        <i class="fas fa-arrow-left"></i>
                        Volver al Dashboard
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <div class="content-wrapper">
        <div class="container-fluid">
            
            <!-- Filtros de Fecha -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="modern-card">
                        <h5>
                            <i class="fas fa-filter text-primary"></i>
                            Filtros de Análisis
                        </h5>
                        
                        <div class="row align-items-end">
                            <div class="col-md-3">
                                <label for="startDate" class="form-label text-muted small">Fecha Desde:</label>
                                <input type="date" id="startDate" class="form-control form-control-modern">
                            </div>
                            
                            <div class="col-md-3">
                                <label for="endDate" class="form-label text-muted small">Fecha Hasta:</label>
                                <input type="date" id="endDate" class="form-control form-control-modern">
                            </div>
                            
                            <div class="col-md-6">
                                <div class="d-flex gap-2">
                                    <button class="btn btn-primary-modern" onclick="filtrarPorFechas()">
                                        <i class="fas fa-search"></i>
                                        Filtrar
                                    </button>
                                    
                                    <button class="btn btn-outline-secondary btn-modern" onclick="filtrarHoy()">
                                        <i class="fas fa-calendar-day"></i>
                                        Hoy
                                    </button>
                                    
                                    <button class="btn btn-success-modern" onclick="exportarExcel()">
                                        <i class="fas fa-file-excel"></i>
                                        Exportar Excel
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Estadísticas Resumen -->
            <div class="row mb-4" id="stats-container">
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-value" id="total-ventas">0</div>
                        <div class="stat-label">Total Ventas</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card" style="background: linear-gradient(135deg, var(--success-color), #34d399);">
                        <div class="stat-value" id="total-monto">$0</div>
                        <div class="stat-label">Monto Total</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card" style="background: linear-gradient(135deg, var(--warning-color), #fbbf24);">
                        <div class="stat-value" id="promedio-venta">$0</div>
                        <div class="stat-label">Promedio por Venta</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card" style="background: linear-gradient(135deg, var(--danger-color), #f87171);">
                        <div class="stat-value" id="hora-pico">--:--</div>
                        <div class="stat-label">Hora Pico</div>
                    </div>
                </div>
            </div>

            <!-- Gráfico de Ventas por Hora -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="modern-card">
                        <h5>
                            <i class="fas fa-chart-line text-primary"></i>
                            Gráfico de Ventas por Hora
                        </h5>
                        <div class="chart-container">
                            <canvas id="ventasChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla Detallada -->
            <div class="row">
                <div class="col-12">
                    <div class="modern-card">
                        <h5>
                            <i class="fas fa-table text-primary"></i>
                            Detalle de Ventas por Hora
                        </h5>
                        
                        <div class="loading-spinner" id="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <p class="mt-2 text-muted">Cargando datos...</p>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-modern">
                                <thead>
                                    <tr>
                                        <th><i class="fas fa-clock me-1"></i>Hora</th>
                                        <th><i class="fas fa-shopping-cart me-1"></i>Cantidad Ventas</th>
                                        <th><i class="fas fa-dollar-sign me-1"></i>Monto Total</th>
                                        <th><i class="fas fa-calculator me-1"></i>Promedio</th>
                                        <th><i class="fas fa-percentage me-1"></i>% del Total</th>
                                    </tr>
                                </thead>
                                <tbody id="ventas-tabla">
                                    <!-- Los datos se cargarán aquí -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/function.js"></script>
    <script src="../assets/js/ventas-por-hora.js"></script>
</body>
</html>
