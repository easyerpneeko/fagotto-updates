<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versiones por Negocio - Fagotto ERP</title>
    <link rel="icon" type="image/x-icon" href="../assets/css/negro.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="../assets/js/jquery-3.6.0.min.js"></script>
    <script src="../assets/helpers/helperURL.js"></script>
    <script src="../assets/helpers/helperSpecial.js"></script>
    <script src="../assets/helpers/helperRoutes.js"></script>
    <script src="../assets/helpers/helperStore.js"></script>
    <script src="../assets/helpers/helperRequest.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .stats-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .stats-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        .stats-label {
            color: #6c757d;
            font-size: 14px;
            margin-top: 5px;
        }
        .version-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .version-latest {
            background-color: #28a745;
            color: white;
        }
        .version-old {
            background-color: #ffc107;
            color: #000;
        }
        .version-outdated {
            background-color: #dc3545;
            color: white;
        }
        .ping-recent { color: #28a745; }
        .ping-warning { color: #ffc107; }
        .ping-offline { color: #dc3545; }
        .btn-back {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn-back:hover {
            background: #f8f9fa;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Volver al Dashboard
        </a>

        <h1 class="text-white text-center mb-4">
            <i class="fas fa-chart-line"></i> Monitor de Versiones - Fagotto ERP
        </h1>

        <!-- Estadísticas -->
        <div class="row" id="stats-row">
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number" id="stat-latest">-</div>
                    <div class="stats-label">ÚLTIMA VERSIÓN</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number" id="stat-total">0</div>
                    <div class="stats-label">TOTAL NEGOCIOS</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number text-success" id="stat-updated">0</div>
                    <div class="stats-label">ACTUALIZADOS</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number text-warning" id="stat-outdated">0</div>
                    <div class="stats-label">DESACTUALIZADOS</div>
                </div>
            </div>
        </div>

        <!-- Tabla de versiones -->
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">
                    <i class="fas fa-store"></i> Negocios y Versiones
                </h3>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Negocio</th>
                                <th>Versión GitHub</th>
                                <th>Versión Usando</th>
                                <th>Estado</th>
                                <th>Última Conexión</th>
                                <th>Offline</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable">
                            <tr>
                                <td colspan="7" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="text-center text-white">
            <small>
                <i class="fas fa-sync-alt"></i> Actualización automática cada 30 segundos
            </small>
        </div>
    </div>

    <script>
        (!_store().serial.isset()) ? window.location.href = "../index.html" : "";
        
        let allData = [];
        let latestVersion = '';

        async function loadData() {
            try {
                const url = generarURLApi('/versions');
                console.log('📡 Cargando versiones desde:', url);
                
                await __conection({
                    url: url,
                    header: credentials(),
                    dev: true,
                    method: 'GET'
                }, {}, function(response) {
                    console.log('✅ Versiones obtenidas:', response);
                    if (response.success) {
                        allData = response.data;
                        latestVersion = response.latest_version;
                        renderStats(response.stats, latestVersion);
                        renderTable(allData, latestVersion);
                    }
                }, function(error) {
                    console.error('❌ Error cargando versiones:', error);
                    document.getElementById('dataTable').innerHTML = `
                        <tr><td colspan="7" class="text-center text-danger">Error al cargar datos</td></tr>
                    `;
                });
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('dataTable').innerHTML = `
                    <tr><td colspan="7" class="text-center text-danger">Error al cargar datos</td></tr>
                `;
            }
        }

        function renderStats(stats, latest) {
            document.getElementById('stat-latest').textContent = latest;
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-updated').textContent = stats.updated;
            document.getElementById('stat-outdated').textContent = stats.outdated;
        }

        function renderTable(data, latestVersion) {
            if (data.length === 0) {
                document.getElementById('dataTable').innerHTML = `
                    <tr><td colspan="7" class="text-center">No hay datos disponibles</td></tr>
                `;
                return;
            }

            const rows = data.map(item => {
                const versionClass = getVersionClass(item.current_version, latestVersion);
                const pingClass = getPingClass(item.minutes_since_ping);
                const statusIcon = getStatusIcon(item.minutes_since_ping);
                const actualizado = item.current_version === latestVersion;
                const isOffline = item.minutes_since_ping > 60;
                
                let estado = isOffline ? '⚫ Offline' : (actualizado ? '✅ OK' : '⚠️ Desactualizado');
                
                return `
                    <tr>
                        <td>${item.app_id}</td>
                        <td><strong>${item.app_name}</strong></td>
                        <td><span class="version-badge version-latest">v${latestVersion}</span></td>
                        <td><span class="version-badge ${versionClass}">v${item.current_version}</span></td>
                        <td class="${pingClass}">${estado}</td>
                        <td class="${pingClass}">
                            ${item.last_ping_formatted}
                        </td>
                        <td class="${isOffline ? 'ping-offline' : ''}">
                            ${item.minutes_since_ping} min
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('dataTable').innerHTML = rows;
        }

        function getVersionClass(currentVersion, latestVersion) {
            if (currentVersion === latestVersion) return 'version-latest';
            
            const current = parseVersion(currentVersion);
            const latest = parseVersion(latestVersion);
            
            const diff = (latest.major - current.major) * 100 + 
                         (latest.minor - current.minor) * 10 + 
                         (latest.patch - current.patch);
            
            if (diff <= 5) return 'version-old';
            return 'version-outdated';
        }

        function parseVersion(version) {
            const parts = version.split('.').map(Number);
            return {
                major: parts[0] || 0,
                minor: parts[1] || 0,
                patch: parts[2] || 0
            };
        }

        function getPingClass(minutes) {
            if (minutes <= 10) return 'ping-recent';
            if (minutes <= 60) return 'ping-warning';
            return 'ping-offline';
        }

        function getStatusIcon(minutes) {
            if (minutes <= 10) return 'fas fa-circle ping-recent';
            if (minutes <= 60) return 'fas fa-circle ping-warning';
            return 'fas fa-circle ping-offline';
        }

        // Cargar datos al inicio
        loadData();
        
        // Auto-refresh cada 30 segundos
        setInterval(loadData, 30000);
    </script>
</body>
</html>
